<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PADDING</title>
    <style>
*{
    margin: 0;
    padding: 0;
}
.pad{
    height: 50px;
    width: 50px;
    padding: 2px;

}
#first{
    margin: 20px 20px 30px 40px;
    border: 20px,solid;
    border-radius: 5%; 
    background-color: rgb(127, 150, 255);
}
#second{
    margin: 50px;
    border: 5px,dashed rgb(140, 255, 0); 
    background-color: rgb(255, 127, 189);
}



    </style>
</head>
<body>
    <div id="first" class="pad">first</div>
        <!-- This heading is displayed --> <div id="second" class="pad">second</div>
</body>
</html>
