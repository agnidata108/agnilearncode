<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text align</title>
    <style>
.box{
    height: 100px;
    width: 100px;

}
#box1{
    background-color: rgb(138, 220, 220);
    text-align: center;
}
#box2{
    background-color: rgb(188, 149, 225);
    text-align: left;
}
#box3{
    background-color: rgb(29, 153, 157);
    text-align: right;
}


    </style>
    
</head>
<body>
    <div id="box1" class="box"> BOX1</div>
       <div id="box2" class="box"> BOX2</div>
          <div id="box3" class="box"> BOX3</div>
             
</body>
</html>
